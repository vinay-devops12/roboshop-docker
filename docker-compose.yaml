name: roboshop

services:
  mongodb:
    build: ./mongodb
    image: joindevops/mongodb:v1
    container_name: mongodb

  catalogue:
    build: ./catalogue
    image: joindevops/catalogue:v1
    container_name: catalogue
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    image: joindevops/frontend:v1
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - catalogue
  user:
    build: ./user
    image: joindevops/user:v1
    container_name: user
    environment:
      MONGO= true
      REDIS_URL='redis://redis:6379'
      MONGO_URL="mongodb://mongodb:27017/users"
    depends_on:
      - redis
      - mongodb
  redis:
    image: redis:7
    container_name: redis ## docker run -d --name --network roboshop redis:7



networks:
  default:
    name: roboshop
    driver: bridge
    external: false